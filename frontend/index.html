<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Blogify – Share ideas, stories and experiences that inspire people to learn and grow." />
    <title>Blogify – Share Your Story with the World</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS v3 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            },
            colors: {
              primary: '#0a0a0c',
              secondary: '#16161a',
              accent: '#6366f1',
              'accent-end': '#a855f7',
            },
            backgroundImage: {
              'accent-gradient': 'linear-gradient(135deg, #6366f1 0%, #a855f7 100%)',
            },
          }
        }
      }
    </script>
    <style>
      body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
      .text-gradient {
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .bg-accent-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #0a0a0c; }
      ::-webkit-scrollbar-thumb { background: #2d2d35; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #3d3d4a; }
    </style>
  </head>
  <body class="bg-[#0a0a0c] text-white antialiased overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
